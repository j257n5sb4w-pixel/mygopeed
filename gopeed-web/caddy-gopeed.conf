
# ---- Gopeed WebUI（MyGo 写的 Go 原生界面，编译成 wasm）----
# 同源反代 /api，前端不需要跨域；直接 IP:8090 访问
:8090 {
	# 20 MB 的 wasm 在零三上现压太慢，改成预先压好 app.wasm.gz 直接发
	encode zstd gzip
	header {
		X-Content-Type-Options nosniff
		-Server
	}
	@wasm path /app.wasm
	header @wasm Cache-Control "no-cache"

	handle /api/* {
		reverse_proxy 127.0.0.1:9999
	}
	handle {
		root * /srv/gopeed-web
		file_server {
			precompressed gzip
		}
	}
}
