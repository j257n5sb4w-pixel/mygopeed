# mygopeed / docker-compose.yml
#
# 面板已经 //go:embed 进 gopeed 二进制，UI 与 REST API 共用同一个端口，
# 容器里只有一个进程，不需要 Caddy。
#
# 用法：
#   1. 把本文件与 Dockerfile、.dockerignore、docker/、gopeed-patched/、gopeed-web/ 放在一起（仓库根目录即可）
#   2. 首次启动前把 PANEL_PASS 改成你要的口令（或留空让容器随机生成，日志里会打印）
#   3. docker compose build
#   4. docker compose up -d
#   5. 浏览器打开 http://<主机IP>:8090

services:
  mygopeed:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: 1.9.3-my
        # 国内构建加速；能直连 proxy.golang.org 就删掉这一行
        GOPROXY: https://goproxy.cn,direct
    image: mygopeed:1.9.3-my
    container_name: mygopeed

    restart: unless-stopped

    ports:
      # 面板 + REST API（唯一的对外端口）
      - "8090:8090"
      # BT：必须固定并同时映射 TCP 与 UDP，否则每次重启端口变化、外部无法连入
      - "51413:51413/tcp"
      - "51413:51413/udp"

    environment:
      TZ: Asia/Shanghai
      # Go 1.19+ 原生识别 GOMEMLIMIT：让 GC 在接近 cgroup 上限前就开始追赶，
      # 比放任 runtime 摸到 mem_limit 被内核 OOM kill 要稳
      GOMEMLIMIT: 400MiB
      # 容器内运行用户；下载目录属主由 entrypoint 按这两个值 chown
      PUID: "0"
      PGID: "0"
      UMASK: "022"

      # 面板与 API 共用这一个端口
      PANEL_PORT: "8090"
      PANEL_USER: gopeed
      PANEL_PASS: "change-me"      # 改成自己的口令；留空则每次启动随机生成并打印到日志
      PANEL_AUTH: "on"             # 强烈建议保持 on

      # BT 监听端口，必须与上面 ports 里的 51413 一致
      BT_LISTEN_PORT: "51413"

      DOWNLOAD_DIR: /downloads
      # OrangePi Zero3 只有 969MB 内存，同时跑 5 个任务容易 OOM
      MAX_RUNNING: "3"

    volumes:
      # 任务库 + 日志（删了就要重新添加所有任务）
      - ./data/storage:/app/storage
      # 下载目录（宿主上改成自己的大盘路径）
      - ./data/downloads:/downloads

    # 单进程后不再需要给 Caddy 留内存，但 gopeed 自己解压大包时会吃内存，
    # 400M 是原 systemd 的值，宿主吃紧就往下调，别低于 320M。
    mem_limit: 512m
    memswap_limit: 512m

    # 给 gopeed 的 SIGTERM 优雅退出（pause 全部任务 + 落库）留足时间
    stop_grace_period: 30s

    healthcheck:
      # 探面板首页（静态页免鉴权），busybox 自带 wget，镜像里不需要额外装 curl
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
